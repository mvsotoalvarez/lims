<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%230C6E7A'/%3E%3Cpath d='M10 4v6l-4 8a1.5 1.5 0 0 0 1.3 2h9.4a1.5 1.5 0 0 0 1.3-2l-4-8V4M9 4h6' fill='none' stroke='%23fff' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta name="theme-color" content="#0A2F3A">
<meta name="description" content="Prototipo de LIMS para el Instituto de Catálisis y Petroleoquímica (ICP-UAM).">
<title>LIMS ICP-UAM</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Tema "laboratorio universitario de química": bata blanca, bancada de epoxi verde-azulada, papel milimetrado y acentos de reactivo (ámbar = pendiente, verde = aprobado, carmín = rechazado). */
/* Layout: barra lateral oscura (escritorio) → barra de iconos (tablet) → barra inferior táctil (móvil, uso con guantes). */
:root{
  --bg:#EAF2F3; --surface:#FFFFFF; --surface-2:#F1F7F8; --ink:#12313B; --muted:#5B7680; --line:#D5E3E6; --tint:#DDF0F1;
  --primary:#0C6E7A; --primary-d:#084C56; --on-primary:#FFFFFF; --link:#0A5D68; --focus:#E6A700;
  --side:#0A2F3A; --side-2:#12424F; --side-ink:#CFE4E8; --side-mut:#8FB1B9;
  --ok:#2FB56B; --ok-ink:#0B6A3A; --ok-bg:#DFF5E8;
  --warn-ink:#8A5400; --warn-bg:#FFF0C9; --bad:#B3261E; --bad-bg:#FCE6E3;
  --gold:#E6A700; --silver:#9FB4BA;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --shadow:0 1px 2px rgba(10,47,58,.06),0 4px 14px rgba(10,47,58,.05);
  --r:14px;
}

*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
html,body{min-height:100%}
html{-webkit-text-size-adjust:100%}
body{
  background-color:var(--bg);
  /* papel milimetrado muy sutil */
  background-image:linear-gradient(rgba(12,110,122,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(12,110,122,.055) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink);font:15px/1.5 var(--font);margin:0;padding-inline:0;overflow-x:hidden}
h1,h2,h3,p{margin:0}
h1,h2,h3{text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}

/* Estructura */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;align-self:start;background:linear-gradient(180deg,var(--side) 0%,#0B3A47 100%);color:var(--side-ink);display:flex;flex-direction:column;gap:26px;padding:22px 14px;padding-top:calc(22px + env(safe-area-inset-top,0px));overflow-y:auto;border-right:4px solid var(--primary)}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px;color:#fff}
.logo{width:42px;height:42px;flex:none}
.brand b{display:block;font-size:17px;font-weight:700;letter-spacing:.01em;line-height:1.15;color:#fff}
.brand span{display:block;font-size:12px;color:var(--side-mut);line-height:1.25;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:6px}
.nav button{display:flex;align-items:center;gap:12px;min-height:52px;padding:0 16px;border:0;border-left:4px solid transparent;border-radius:10px;background:none;cursor:pointer;font-weight:600;color:var(--side-ink);text-align:left;transition:background .15s}
.nav button:hover{background:rgba(255,255,255,.08)}
.nav button[aria-current="page"]{background:var(--side-2);color:#fff;border-left-color:var(--gold)}
.nav button svg{flex:none}
.nav .badge{margin-left:auto;background:var(--gold);color:#3A2600;border-radius:99px;font-size:12px;padding:1px 9px;font-weight:700}
.side-foot{margin-top:auto;padding:12px 8px 0;font-size:12px;color:var(--side-mut);border-top:1px dashed rgba(255,255,255,.18)}
.col{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--line);box-shadow:0 1px 0 var(--surface),0 2px 10px rgba(10,47,58,.05)}
.top::before{content:"";display:block;height:4px;background:repeating-linear-gradient(135deg,var(--gold) 0 14px,var(--side) 14px 28px);opacity:.9}
.top-in{padding:12px 28px;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;min-height:72px}
.top h1{font-size:clamp(18px,2.2vw,24px);font-weight:700;min-width:0;color:var(--primary-d)}
.who{display:flex;align-items:center;gap:12px;min-width:0}
.who select{height:48px;min-width:260px;max-width:100%;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);padding:0 12px;font-weight:600}
.avatar{width:44px;height:44px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;font-weight:700;flex:none;box-shadow:0 0 0 3px var(--tint)}
.who-t{line-height:1.25;min-width:0}
.who-t b{display:block;font-weight:600;white-space:nowrap}
.who-t small{color:var(--muted);font-size:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
main{padding:26px 28px 56px;max-width:1320px;width:100%}
.page-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.page-h p{color:var(--muted);max-width:60ch}

/* Tarjetas y formularios */
.card{background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--primary);border-radius:var(--r);padding:20px;box-shadow:var(--shadow);min-width:0}
.card+.card{margin-top:16px}
.card h2{font-size:17px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:10px;color:var(--primary-d)}
.card h2 .step{font-family:var(--mono);font-size:13px;background:var(--primary);border:0;color:#fff;border-radius:50%;width:26px;height:26px;display:inline-grid;place-items:center;flex:none}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.in{height:52px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);padding:0 14px;width:100%;min-width:0;transition:border-color .15s,box-shadow .15s}
textarea.in{height:auto;min-height:110px;padding:12px 14px;resize:vertical}
.in:hover{border-color:#B7CFD4}
.in:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(12,110,122,.16);outline:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;min-height:56px;padding:0 22px;border-radius:12px;border:1.5px solid var(--primary);background:var(--primary);color:var(--on-primary);font-weight:600;cursor:pointer;font-size:16px;text-align:center;transition:background .15s,transform .05s}
.btn:hover:not(:disabled){background:var(--primary-d);border-color:var(--primary-d)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--link)}
.btn.ghost:hover:not(:disabled){background:var(--tint);border-color:var(--primary)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#052E18}
.btn.ok:hover:not(:disabled){background:#27A05F;border-color:#27A05F}
.btn.bad{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn.bad:hover:not(:disabled){background:var(--bad-bg);border-color:var(--bad)}
.btn.sm{min-height:44px;padding:0 14px;font-size:14px;border-radius:10px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.listening{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.listening svg{animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.25)}}
@media (prefers-reduced-motion:reduce){.btn.listening svg{animation:none}.btn,.in,.nav button{transition:none}}
.row-actions{display:flex;gap:12px;flex-wrap:wrap}
.hint{font-size:13px;color:var(--muted)}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{min-height:52px;padding:0 16px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface-2);cursor:pointer;font-weight:600;flex:1 1 140px}
.seg button:hover{border-color:var(--primary)}
.seg button[aria-pressed="true"]{border-color:var(--primary);background:var(--primary);color:var(--on-primary)}

/* Reactivos */
.reag{border:1.5px solid var(--line);border-left:5px solid var(--primary);border-radius:12px;padding:12px;background:var(--surface-2);position:relative}
.reag+.reag{margin-top:12px}
.reag-grid{display:grid;gap:10px;grid-template-columns:minmax(0,2fr) minmax(0,1fr) minmax(0,.9fr) minmax(0,.8fr)}
.sugg{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--surface);border:1.5px solid var(--primary);border-radius:10px;box-shadow:0 10px 30px rgba(10,47,58,.25);max-height:260px;overflow:auto;margin-top:4px}
.sugg button{display:flex;justify-content:space-between;gap:10px;width:100%;min-height:50px;align-items:center;padding:6px 14px;border:0;background:none;text-align:left;cursor:pointer}
.sugg button:hover,.sugg button:focus-visible{background:var(--tint)}
.sugg small{color:var(--muted);text-align:right}
.calc{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin-top:10px;padding-top:10px;border-top:1px dashed #B7CFD4;font-size:13px;color:var(--muted)}
.calc b{color:var(--primary-d);font-family:var(--mono);font-weight:500}

.rm{margin-left:auto;width:44px;height:44px;border:0;background:none;color:var(--muted);cursor:pointer;border-radius:8px;display:grid;place-items:center}
.rm:hover{color:var(--bad);background:var(--bad-bg)}
.result{background:linear-gradient(135deg,var(--tint),#EAF7F4);border:1px solid #BFE0E2;color:var(--ink);border-radius:12px;padding:16px;display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.result div span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.result div b{font-family:var(--mono);font-size:clamp(18px,2.4vw,22px);font-weight:500;color:var(--primary-d)}
.thumbs{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.submit-bar{position:sticky;bottom:0;z-index:10;margin-top:16px;display:flex;gap:12px;flex-wrap:wrap;background:linear-gradient(180deg,rgba(234,242,243,0),var(--bg) 30%);padding:18px 0 12px}

/* Estados */
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:99px;padding:3px 11px;font-size:12px;font-weight:700;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.pend{background:var(--warn-bg);color:var(--warn-ink)}
.pill.ok{background:var(--ok-bg);color:var(--ok-ink)}
.pill.rej{background:var(--bad-bg);color:var(--bad)}

/* Tablas */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;min-width:1040px}
th{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:#fff;text-align:left;padding:13px 14px;background:var(--primary-d);white-space:nowrap}
td{padding:12px 14px;border-top:1px solid var(--line);vertical-align:middle}
tbody tr:nth-child(even) td{background:#F6FAFB}
tbody tr:hover td{background:var(--tint)}
tr.sel td,tbody tr.sel:hover td{background:#CFE8EA}
td .id{font-family:var(--mono);font-weight:600;color:var(--link);white-space:nowrap}
td.nw{white-space:nowrap}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.filters .in{height:48px;flex:1 1 170px;max-width:260px}
.detail{margin-top:16px}
.kv{display:grid;gap:10px 18px;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));margin-bottom:14px}
.kv div span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.kv div b{font-weight:600}
.note{background:var(--surface-2);border-left:4px solid var(--silver);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.note.bad{background:var(--bad-bg);color:var(--bad);border-left-color:var(--bad)}
.empty{padding:34px 16px;text-align:center;color:var(--muted)}

/* Dashboard */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));margin-bottom:16px}
.kpi{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--primary);border-radius:var(--r);padding:14px 16px;box-shadow:var(--shadow)}
.kpi:nth-child(2){border-left-color:var(--ok)}
.kpi:nth-child(3){border-left-color:var(--gold)}
.kpi:nth-child(4){border-left-color:var(--primary-d)}
.kpi span{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.kpi b{font-family:var(--mono);font-weight:500;font-size:clamp(24px,3vw,30px);color:var(--primary-d)}
.kpi small{color:var(--muted);margin-left:4px}
.charts{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,440px),1fr))}
.charts .card+.card{margin-top:0}
.cbox{position:relative;height:300px}
.cbox.tall{height:340px}

input.chk{width:22px;height:22px;accent-color:var(--primary);cursor:pointer}
.pager{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-top:16px}
.pg-nav,.pg-info{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pg-info{color:var(--muted);font-size:14px;gap:12px}
.pg{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:16px}
.pg:hover:not(:disabled){border-color:var(--primary);background:var(--tint)}
.pg[aria-current="true"]{background:var(--primary);border-color:var(--primary);color:#fff}
.pg:disabled{opacity:.45;cursor:not-allowed}
/* Toast y navegación móvil */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:28px;background:var(--side);color:#fff;border-left:5px solid var(--gold);padding:14px 20px;border-radius:12px;font-weight:600;z-index:60;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(10,47,58,.4)}
.mnav{display:none}

/* Tablet: barra lateral compacta solo con iconos */
@media (max-width:1100px) and (min-width:901px){
  .app{grid-template-columns:84px minmax(0,1fr)}
  .side{padding-inline:10px;align-items:center}
  .brand{padding:0}
  .brand div,.side-foot{display:none}
  .nav{width:100%}
  .nav button{flex-direction:column;justify-content:center;gap:4px;min-height:64px;padding:6px 2px;font-size:11px;border-left:0;border-bottom:3px solid transparent;text-align:center;position:relative}
  .nav button[aria-current="page"]{border-bottom-color:var(--gold)}
  .nav .badge{position:absolute;top:4px;right:6px;margin:0;font-size:11px;padding:0 6px}
  main{padding:22px 20px 48px}
  .top-in{padding:12px 20px}
}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mnav{display:grid;grid-template-columns:repeat(var(--n,3),1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--side);border-top:3px solid var(--primary);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 20px rgba(10,47,58,.25)}
  .mnav button{position:relative;min-height:68px;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:600;color:var(--side-mut);cursor:pointer}
  .mnav button[aria-current="page"]{color:#fff;background:var(--side-2);box-shadow:inset 0 3px 0 var(--gold)}
  .mnav .badge{position:absolute;top:6px;left:calc(50% + 8px);background:var(--gold);color:#3A2600;border-radius:99px;font-size:11px;padding:0 6px;font-weight:700}
  .top-in{padding:10px 16px;min-height:60px}
  .who{flex:1 1 170px;justify-content:flex-end}
  .who-t{display:none}
  .who select{min-width:0;width:100%;max-width:300px}
  main{padding:16px 16px 110px}
  .card{padding:16px}
  .submit-bar{bottom:calc(68px + env(safe-area-inset-bottom,0px));flex-wrap:nowrap}
  .submit-bar .btn{flex:1 1 0;padding:0 12px;font-size:15px}
  .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .reag-grid{grid-template-columns:1fr 1fr}
  .reag-grid .f-name{grid-column:1/-1}
  .filters .in{max-width:none}
  .cbox,.cbox.tall{height:280px}
}
@media (max-width:600px){
  .top-in{gap:8px}
  .top h1{flex:1 1 100%}
  .who{flex:1 1 100%;justify-content:stretch}
  .who select{max-width:none}
  .avatar{display:none}
  .page-h{align-items:stretch}
  .page-h .row-actions,.page-h .btn{width:100%}
  .page-h .row-actions .btn{flex:1 1 100%}
  .row-actions .btn{flex:1 1 auto}
  .pager{justify-content:center}
  .pg-info{justify-content:center;text-align:center}
  .kpis{grid-template-columns:1fr 1fr}
  .kpi{padding:12px}
  .charts{grid-template-columns:minmax(0,1fr)}

  /* Tabla del panel → tarjetas apiladas */
  .tbl-wrap.stack{overflow:visible;border:0;background:none;box-shadow:none}
  .stack table,.stack thead,.stack tbody,.stack tr,.stack td{display:block;min-width:0;width:100%}
  .stack thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .stack tbody tr{background:var(--surface)!important;border:1px solid var(--line);border-left:5px solid var(--primary);border-radius:var(--r);padding:8px 14px;margin-bottom:12px;box-shadow:var(--shadow)}
  .stack tbody tr.sel{border-left-color:var(--gold)}
  .stack td,.stack tbody tr:nth-child(even) td,.stack tbody tr:hover td,.stack tr.sel td{background:none;border:0;padding:5px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:right}
  .stack td::before{content:attr(data-l);font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:left;flex:none}
  .stack td[data-l=""]::before{display:none}
  .stack td.nw{white-space:normal}
  .stack td:first-child{justify-content:flex-start}
  .stack td.empty{display:block;text-align:center}
  .stack td.empty::before{display:none}
}
@media (max-width:380px){
  .reag-grid{grid-template-columns:1fr}
  .kpis{grid-template-columns:1fr}
  .btn{padding:0 14px}
}

/* ===== Versión con más color: ambiente de laboratorio ===== */
:root{--bg:#CFE6E8;--tint:#C4E5E8;--line:#B4D2D6;--surface-2:#E6F3F4}
body{
  background-image:
    radial-gradient(circle at 12% 8%,rgba(230,167,0,.18),transparent 32%),
    radial-gradient(circle at 92% 30%,rgba(47,181,107,.16),transparent 34%),
    linear-gradient(rgba(8,76,86,.09) 1px,transparent 1px),linear-gradient(90deg,rgba(8,76,86,.09) 1px,transparent 1px);
  background-size:auto,auto,24px 24px,24px 24px;background-attachment:fixed}
/* Cabecera: bloque turquesa intenso con texto blanco */
.top{background:linear-gradient(100deg,#084C56 0%,#0C6E7A 55%,#13909A 100%);border-bottom:0;box-shadow:0 4px 18px rgba(8,76,86,.35)}
.top h1{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.who-t b{color:#fff}.who-t small{color:#BFE6EA}
.avatar{background:var(--gold);color:#3A2600;box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.who select{background:rgba(255,255,255,.95);border-color:transparent}
/* Barra lateral con más profundidad */
.side{background:linear-gradient(180deg,#06222B 0%,#0A3C4A 55%,#0C6E7A 130%);border-right:0;box-shadow:4px 0 18px rgba(6,34,43,.3)}
.nav button[aria-current="page"]{background:linear-gradient(90deg,rgba(230,167,0,.25),rgba(255,255,255,.1))}
/* Tarjetas con encabezado coloreado */

/* ---------- Estequiometría ---------- */
/* rows:[{k,amt,unit,pur}] · vfin: mL de disolución final (o null → suma de volúmenes) */
function calc(rows,vfin){
  let vsum=0,support=0,metal=0;const out=[];
  rows.forEach(r=>{const d=RBY[r.k];if(d&&r.unit==='mL'&&r.amt>0)vsum+=+r.amt;});
  const V=vfin>0?vfin:vsum;
  rows.forEach(r=>{
    const d=RBY[r.k];if(!d){out.push(null);return}
    const a=+r.amt||0;let g=0;
    if(r.unit==='g')g=a;else if(r.unit==='mg')g=a/1000;
    else if(r.unit==='mL')g=a*(d.rho||1);else if(r.unit==='µL')g=a/1000*(d.rho||1);
    const pur=(r.pur>0?r.pur:d.pur)/100;
    const mol=d.mw?g*pur/d.mw:null;               // mol
    const M=(mol!=null&&V>0&&d.role!=='solvente'&&d.role!=='soporte')?mol/(V/1000):null;
    if(d.role==='soporte')support+=g;
    if(d.metal&&mol!=null)metal+=mol*d.metal.mw;
    out.push({g,mol,M,d});
  });
  const load=support>0&&metal>0?metal/(support+metal)*100:null;
  return{rows:out,V,vsum,support,metal,load};
}
function toGrams(r){const d=RBY[r.k];if(!d)return 0;const a=+r.amt||0;
  return r.unit==='g'?a:r.unit==='mg'?a/1000:r.unit==='mL'?a*(d.rho||1):a/1000*(d.rho||1)}

function bindForm(){
  const f=S.form;
  $$('#typeSeg button').forEach(b=>b.onclick=()=>{f.type=b.dataset.t;initExtra(f);viewForm($('#view'))});
  $('#proj').onchange=e=>f.project=e.target.value;
  $('#sample').oninput=e=>f.sample=e.target.value;
  $('#vfin').oninput=e=>{f.vfin=e.target.value.replace(',','.');updateCalc()};
  $('#notes').oninput=e=>f.notes=e.target.value;
  $('#addRow').onclick=()=>{f.rows.push(blankRow());renderRows()};
  $('#clear').onclick=()=>{S.form=null;viewForm($('#view'));toast('Formulario limpio')};
  $('#send').onclick=submitForm;
  $('#dict').onclick=()=>{
    const b=$('#dict');if(f.listening)return;f.listening=true;
    b.classList.add('listening');b.querySelector('span').textContent='Escuchando…';
    setTimeout(()=>{f.listening=false;b.classList.remove('listening');b.querySelector('span').textContent='Dictado por voz';
      const ta=$('#notes');if(!ta)return;f.notes=(f.notes?f.notes+'\n':'')+PHRASES[f.type];ta.value=f.notes;toast('Dictado añadido a las observaciones')},2200);
  };
  $('#photo').onchange=e=>{
    [...e.target.files].slice(0,4-f.photos.length).forEach(file=>{
      const fr=new FileReader();fr.onload=()=>{f.photos.push(fr.result);renderThumbs()};fr.readAsDataURL(file)});
    e.target.value='';
  };
}
function renderThumbs(){
  const f=S.form,t=$('#thumbs');if(!t)return;
  t.innerHTML=f.photos.map((p,i)=>`<img src="${p}" alt="Adjunto ${i+1}">`).join('')+(f.photos.length?`<span class="hint" style="align-self:center">${f.photos.length} adjunto(s)</span>`:'');
}
function renderExtra(){
  const f=S.form,box=$('#extra');
  box.innerHTML=SUBST[f.type].fields.map(x=>{
    const val=f.extra[x.id]??'';
    const inp=x.t==='sel'?`<select class="in" id="x_${x.id}">${x.o.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join('')}</select>`
      :`<input class="in ${x.t==='num'?'mono':''}" id="x_${x.id}" ${x.t==='num'?'inputmode="decimal"':''} placeholder="${esc(x.ph||'')}" value="${esc(val)}">`;
    return `<div class="field"><label for="x_${x.id}">${x.l}</label>${inp}</div>`}).join('');
  SUBST[f.type].fields.forEach(x=>{const el=$('#x_'+x.id);el.oninput=el.onchange=()=>f.extra[x.id]=x.t==='num'?el.value.replace(',','.'):el.value});
}

function renderRows(){
  const f=S.form,box=$('#rows');
  box.innerHTML=f.rows.map((r,i)=>`
  <div class="reag" data-i="${i}">
    <div class="reag-grid">
      <div class="field f-name" style="position:relative"><label for="nm${i}">Reactivo o solvente</label>
        <input class="in nm" id="nm${i}" autocomplete="off" placeholder="H₂PtCl₆, Al₂O₃, Zeolita Y, Etanol…" value="${esc(r.q)}">
        <div class="sugg" hidden></div></div>
      <div class="field"><label for="am${i}">Cantidad</label><input class="in mono amt" id="am${i}" inputmode="decimal" placeholder="0,00" value="${esc(r.amt)}"></div>
      <div class="field"><label for="un${i}">Unidad</label><select class="in unit" id="un${i}">${['g','mg','mL','µL'].map(u=>`<option ${u===r.unit?'selected':''}>${u}</option>`).join('')}</select></div>
      <div class="field"><label for="pu${i}">Pureza (%)</label><input class="in mono pur" id="pu${i}" inputmode="decimal" placeholder="${RBY[r.k]?RBY[r.k].pur:'100'}" value="${esc(r.pur)}"></div>
    </div>
    <div class="calc" id="calc${i}"></div>
  </div>`).join('');
  $$('.reag',box).forEach(el=>{
    const i=+el.dataset.i,r=f.rows[i],nm=$('.nm',el),sg=$('.sugg',el);
    const pick=d=>{r.k=d.k;r.q=d.n;nm.value=d.n;r.unit=d.rho?'mL':'g';$('.unit',el).value=r.unit;$('.pur',el).placeholder=d.pur;sg.hidden=true;updateCalc()};
    const show=()=>{
      const q=norm(nm.value);
      const hits=REAG.filter(d=>!q||norm(d.n+d.k+d.alt).includes(q)).slice(0,6);
      if(!hits.length){sg.hidden=true;return}
      sg.innerHTML=hits.map(d=>`<button type="button" data-k="${d.k}"><span>${d.n}</span><small>${d.alt}${d.mw?' · '+nf(d.mw,2)+' g/mol':''}</small></button>`).join('');
      sg.hidden=false;
      $$('button',sg).forEach(b=>{b.onmousedown=e=>e.preventDefault();b.onclick=()=>pick(RBY[b.dataset.k])});
    };
    nm.onfocus=show;
    nm.oninput=()=>{r.q=nm.value;const ex=REAG.find(d=>norm(d.n)===norm(nm.value)||norm(d.k)===norm(nm.value));r.k=ex?ex.k:'';show();updateCalc()};
    nm.onblur=()=>setTimeout(()=>sg.hidden=true,120);
    $('.amt',el).oninput=e=>{r.amt=e.target.value.replace(',','.');updateCalc()};
    $('.unit',el).onchange=e=>{r.unit=e.target.value;updateCalc()};
    $('.pur',el).oninput=e=>{r.pur=e.target.value.replace(',','.');updateCalc()};
  });
}
function updateCalc(){
  const f=S.form;if(!f||!$('#res'))return;
  const c=calc(f.rows,+f.vfin);
  f.rows.forEach((r,i)=>{
    const el=$('#calc'+i);if(!el)return;
    const o=c.rows[i];let h='';
    if(!r.q)h='<span>Elige un reactivo para calcular masa, moles y molaridad.</span>';
    else if(!o)h='<span>Reactivo fuera del catálogo: sin cálculo automático.</span>';
    else{
      h=`<span>Masa <b>${nf(o.g,4)} g</b></span>`;
      if(o.mol!=null)h+=`<span>n <b>${nf(o.mol*1000,3)} mmol</b></span>`;else h+='<span>Sin masa molar definida: solo masa.</span>';
      if(o.M!=null)h+=`<span>Molaridad <b>${nf(o.M,4)} mol/L</b></span>`;
      if(o.d.metal&&o.mol!=null)h+=`<span>${o.d.metal.s} aportado <b>${nf(o.mol*o.d.metal.mw*1000,2)} mg</b></span>`;
    }
    h+=f.rows.length>1?`<button type="button" class="rm" aria-label="Quitar reactivo" data-rm="${i}">${ico('x',20)}</button>`:'';
    el.innerHTML=h;
    const b=$('[data-rm]',el);if(b)b.onclick=()=>{f.rows.splice(i,1);renderRows();updateCalc()};
  });
  const total=c.rows.reduce((s,o)=>s+(o?o.g:0),0);
  const items=[['Volumen de disolución',c.V>0?nf(c.V,2)+' mL':'—'],['Masa total pesada',nf(total,3)+' g']];
  if(c.load!=null)items.push(['Carga metálica nominal',nf(c.load,2)+' % p/p']);
  items.push(['Reactivos',String(f.rows.filter(r=>r.q).length)]);
  $('#res').innerHTML=items.map(([l,v])=>`<div><span>${l}</span><b>${v}</b></div>`).join('');
}
function submitForm(){
  const f=S.form;
  const rows=f.rows.filter(r=>r.q&&+r.amt>0).map(r=>({k:r.k||'x:'+r.q,name:r.q,amt:+r.amt,unit:r.unit}));
  if(!f.sample.trim()){toast('Falta el nombre de la muestra o lote');$('#sample').focus();return}
  if(f.type==='sint'&&!rows.length){toast('Añade al menos un reactivo con su cantidad');return}
  const ex={};Object.entries(f.extra).forEach(([k,v])=>{if(v!=='')ex[k]=/^(tcal|dur|treac|pres|conv|sel|yield)$/.test(k)?+v:v});
  const id='ICP-26-0'+S.next;
  S.records.unshift({id,lote:'L'+S.next,date:TODAY,tech:S.role,type:f.type,project:f.project,sample:f.sample.trim(),status:'pend',
    yield:ex.yield??null,reag:rows,extra:ex,notes:f.notes,comment:'',photos:f.photos.slice()});
  S.next++;S.form=null;S.tab=S.role==='admin'?'panel':'mios';S.sel=null;render();window.scrollTo(0,0);
  toast(id+' enviado: pendiente de revisión');
}

  return S.records.filter(r=>(!st||r.status===st)&&(!tech||r.tech===tech)&&(!q||norm(r.id+r.sample+r.project).includes(norm(q))));
}

    <td class="mono" data-l="Rend. %">${nf(r.yield,1)}</td><td data-l="Estado">${pill(r.status)}</td>
    <td data-l=""><button class="btn sm ghost" type="button" data-open="${r.id}">${ico('eye',18)} Revisar</button></td></tr>`).join('')||'<tr><td colspan="10" class="empty" data-l="">Ningún registro coincide con los filtros.</td></tr>'}</tbody></table></div>
  <div class="pager">
    <div class="pg-nav"><button class="pg" type="button" id="pgPrev" aria-label="Página anterior" ${S.page<=1?'disabled':''}>‹</button>${Array.from({length:pages},(_,i)=>`<button class="pg" type="button" data-pg="${i+1}" ${i+1===S.page?'aria-current="true"':''}>${i+1}</button>`).join('')}<button class="pg" type="button" id="pgNext" aria-label="Página siguiente" ${S.page>=pages?'disabled':''}>›</button></div>

function detail(r){
  if(!r)return;
  const c=calc(r.reag,0);
  const ex=SUBST[r.type].fields.filter(x=>r.extra[x.id]!=null&&r.extra[x.id]!=='').map(x=>`<div><span>${x.l}</span><b>${esc(r.extra[x.id])}</b></div>`).join('');
  $('#detail').innerHTML=`<section class="card detail">
    <h2 style="justify-content:space-between;flex-wrap:wrap"><span>${r.id} · ${r.sample}</span>${pill(r.status)}</h2>
    <div class="kv"><div><span>Técnico</span><b>${TECH_SHORT[r.tech]}</b></div><div><span>Fecha</span><b>${fdate(r.date)}</b></div><div><span>Tipo</span><b>${TYPES[r.type]}</b></div><div><span>Proyecto</span><b>${esc(r.project)}</b></div>${ex}</div>
    ${r.reag.length?`<div class="tbl-wrap" style="margin-bottom:14px"><table style="min-width:520px"><thead><tr><th>Reactivo</th><th>Cantidad</th><th>Masa (g)</th><th>n (mmol)</th></tr></thead><tbody>${r.reag.map((x,i)=>{const o=c.rows[i];return `<tr><td>${rname(x)}</td><td class="mono">${nf(x.amt,3)} ${x.unit}</td><td class="mono">${o?nf(o.g,4):'—'}</td><td class="mono">${o&&o.mol!=null?nf(o.mol*1000,3):'—'}</td></tr>`}).join('')}</tbody></table></div>
    ${c.load!=null?`<p class="hint" style="margin-bottom:12px">Carga metálica nominal: <b class="mono" style="color:var(--ink)">${nf(c.load,2)} % p/p</b></p>`:''}`:''}
    ${r.notes?`<div class="note">${esc(r.notes)}</div>`:''}
    ${r.comment?`<div class="note bad"><b>Comentario del revisor:</b> ${esc(r.comment)}</div>`:''}
    ${r.photos.length?`<div class="thumbs" style="margin-bottom:12px">${r.photos.map(p=>`<img src="${p}" alt="Adjunto">`).join('')}</div>`:''}
    <div id="rejBox" hidden><div class="field"><label for="rejTxt">Comentario para el técnico (obligatorio)</label><textarea class="in" id="rejTxt" placeholder="Qué falta o qué hay que repetir"></textarea></div></div>
    <div class="row-actions" style="margin-top:12px">
      <button class="btn ok" type="button" id="bOk" ${r.status==='ok'?'disabled':''}>${ico('check')} Aprobar</button>
      <button class="btn bad" type="button" id="bRej" ${r.status==='rej'?'disabled':''}>${ico('msg')} Rechazar con comentarios</button>
      <button class="btn ghost" type="button" id="bClose">Cerrar</button>
    </div></section>`;
  let asking=false;
  $('#bOk').onclick=()=>{r.status='ok';r.comment='';toast(r.id+' aprobado');S.sel=null;viewPanel($('#view'));renderShell()};
  $('#bRej').onclick=()=>{
    if(!asking){asking=true;$('#rejBox').hidden=false;$('#rejTxt').focus();$('#bRej').innerHTML=ico('send')+' Confirmar rechazo';return}
    const t=$('#rejTxt').value.trim();if(!t){toast('Escribe un comentario para el técnico');$('#rejTxt').focus();return}
    r.status='rej';r.comment=t;toast(r.id+' rechazado con comentarios');S.sel=null;viewPanel($('#view'));renderShell();
  };
  $('#bClose').onclick=()=>{S.sel=null;viewPanel($('#view'))};
}

/* Exportación a Excel (.xlsx) con SheetJS */
function exportXlsx(list){
  if(!list.length){toast('No hay registros que exportar');return}
  if(!window.XLSX){toast('No se pudo cargar el exportador de Excel. Revisa la conexión.');return}
  const head=['Código','Lote','Fecha','Técnico','Tipo','Proyecto','Muestra','Rendimiento (%)','Estado','Reactivos','Comentario del revisor'];
  const rows=list.map(r=>[r.id,r.lote,r.date,TECH_SHORT[r.tech],TYPES[r.type],r.project,r.sample,r.yield,STAT[r.status][1],
    r.reag.map(x=>rname(x)+' '+x.amt+' '+x.unit).join('; '),r.comment]);
  const ws=XLSX.utils.aoa_to_sheet([head,...rows]);
  ws['!cols']=[12,9,11,12,22,34,30,14,22,50,40].map(w=>({wch:w}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Registros');
  XLSX.writeFile(wb,'LIMS-ICP-UAM-registros-'+TODAY+'.xlsx');
  toast('Excel descargado: '+list.length+' registro(s)');
}

/* ---------- C) Dashboard y analítica ---------- */
const cssv=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
function viewDash(v){
  const {from,to,proj}=S.d;
  const rs=S.records.filter(r=>r.date>=from&&r.date<=to&&(!proj||r.project===proj));
  const ys=rs.filter(r=>r.yield!=null);
  const mean=ys.length?ys.reduce((s,r)=>s+r.yield,0)/ys.length:null;
  const okN=rs.filter(r=>r.status==='ok').length;
  v.innerHTML=`<div class="page-h"><div><p>Datos de los registros enviados por los técnicos en el periodo seleccionado.</p></div></div>
  <div class="filters">
    <div class="field" style="flex:1 1 160px;max-width:210px"><label for="dFrom">Desde</label><input class="in mono" type="date" id="dFrom" value="${from}"></div>
    <div class="field" style="flex:1 1 160px;max-width:210px"><label for="dTo">Hasta</label><input class="in mono" type="date" id="dTo" value="${to}"></div>
    <div class="field" style="flex:1 1 240px;max-width:340px"><label for="dProj">Proyecto</label><select class="in" id="dProj"><option value="">Todos los proyectos</option>${PROJECTS.map(p=>`<option ${p===proj?'selected':''}>${esc(p)}</option>`).join('')}</select></div>
  </div>
  <div class="kpis">
    <div class="kpi"><span>Registros</span><b>${rs.length}</b></div>
    <div class="kpi"><span>Aprobados</span><b>${okN}</b><small>${rs.length?nf(okN/rs.length*100,0)+' %':''}</small></div>
    <div class="kpi"><span>Pendientes</span><b>${rs.filter(r=>r.status==='pend').length}</b></div>
    <div class="kpi"><span>Rendimiento medio</span><b>${mean==null?'—':nf(mean,1)}</b><small>${mean==null?'':'%'}</small></div>
  </div>
  <div class="charts">
    <section class="card"><h2>Rendimiento de reacciones por lote</h2><div class="cbox tall"><canvas id="c1" role="img" aria-label="Rendimiento por lote"></canvas></div><p class="hint" style="margin-top:8px">Azul: aprobado · dorado: pendiente · rojo: rechazado.</p></section>
    <section class="card"><h2>Uso de reactivos en el periodo</h2><div class="cbox tall"><canvas id="c2" role="img" aria-label="Uso de reactivos en gramos"></canvas></div><p class="hint" style="margin-top:8px">Masa en gramos; los líquidos se convierten con su densidad. Se excluye el agua.</p></section>
    <section class="card" style="grid-column:1/-1"><h2>Número de ensayos por técnico</h2><div class="cbox"><canvas id="c3" role="img" aria-label="Ensayos por técnico y estado"></canvas></div></section>
  </div>`;
  const redo=()=>viewDash(v);
  $('#dFrom').onchange=e=>{S.d.from=e.target.value||from;redo()};
  $('#dTo').onchange=e=>{S.d.to=e.target.value||to;redo()};
  $('#dProj').onchange=e=>{S.d.proj=e.target.value;redo()};
  charts.forEach(c=>c.destroy());charts=[];
  if(!window.Chart)return;
  const ink=cssv('--muted'),grid=cssv('--line'),blue=cssv('--primary'),gold=cssv('--gold'),ok=cssv('--ok'),bad=cssv('--bad');
  Chart.defaults.font.family=cssv('--font');Chart.defaults.color=ink;Chart.defaults.borderColor=grid;
  const common={responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{boxWidth:12}}}};
  /* 1 · rendimiento por lote */
  const ysort=[...ys].sort((a,b)=>a.date.localeCompare(b.date));
  charts.push(new Chart($('#c1'),{data:{labels:ysort.map(r=>r.lote),datasets:[
    {type:'bar',label:'Rendimiento (%)',data:ysort.map(r=>r.yield),backgroundColor:ysort.map(r=>r.status==='ok'?blue:r.status==='rej'?bad:silver()),borderRadius:4},
    {type:'line',label:'Media',data:ysort.map(()=>mean),borderColor:gold,borderDash:[6,4],pointRadius:0,borderWidth:2}]},
   options:{...common,scales:{y:{min:0,max:100,title:{display:true,text:'Rendimiento (%)'}},x:{ticks:{maxRotation:60,autoSkip:true}}},
    plugins:{...common.plugins,tooltip:{callbacks:{afterLabel:c=>ysort[c.dataIndex]?String(ysort[c.dataIndex].sample).replace(/<[^>]+>/g,'')+' · '+STAT[ysort[c.dataIndex].status][1]:''}}}}}));
  /* 2 · uso de reactivos */
  const use={};rs.forEach(r=>r.reag.forEach(x=>{if(x.k==='H2O')return;const n=rname(x).replace(/<[^>]+>/g,'');use[n]=(use[n]||0)+toGrams(x)}));
  const top=Object.entries(use).sort((a,b)=>b[1]-a[1]).slice(0,8);
  charts.push(new Chart($('#c2'),{type:'bar',data:{labels:top.map(t=>t[0]),datasets:[{label:'Masa (g)',data:top.map(t=>+t[1].toFixed(3)),backgroundColor:blue,borderRadius:4}]},
   options:{...common,indexAxis:'y',plugins:{legend:{display:false}},scales:{x:{title:{display:true,text:'g'}}}}}));
  /* 3 · ensayos por técnico */
  const techs=['t1','t2','t3','admin'].filter(t=>rs.some(r=>r.tech===t));
  const ds=[['ok','Aprobado',ok],['pend','Pendiente de revisión',gold],['rej','Rechazado',bad]].map(([s,l,c])=>({label:l,backgroundColor:c,borderRadius:3,data:techs.map(t=>rs.filter(r=>r.tech===t&&r.status===s).length)}));
  charts.push(new Chart($('#c3'),{type:'bar',data:{labels:techs.map(t=>t==='t1'?'Técnico 1 · Síntesis':t==='t2'?'Técnico 2 · Caracterización':t==='t3'?'Técnico 3 · Actividad':'Admin'),datasets:ds},
   options:{...common,scales:{x:{stacked:true},y:{stacked:true,ticks:{precision:0},title:{display:true,text:'Ensayos'}}}}}));
}
const silver=()=>cssv('--gold');

/* ---------- Arranque ---------- */
initShell();render();

</script>
</body>
